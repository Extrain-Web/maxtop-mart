# ─────────────────────────────────────────────────────────────────────────
#  Maxtop Mart — production stack (Coolify + Traefik)
#
#  Deployed as a single Docker-Compose application in the Coolify project
#  "Maxtop Mart". Coolify auto-generates the Traefik routing + Let's Encrypt
#  SSL and attaches its proxy network, so no manual traefik labels are needed
#  here. Domains are configured in Coolify:
#     client  →  https://maxtopmart.com  (+ www)   → container port 3000
#     backend →  https://api.maxtopmart.com         → container port 5000
#
#  MongoDB is self-hosted in this stack on a persistent named volume and is
#  NOT exposed to the internet — only the backend reaches it over the private
#  compose network. Secrets (JWT) come from Coolify environment variables.
# ─────────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: 'mongo:7'
    restart: unless-stopped
    volumes:
      - 'mongo-data:/data/db'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./maxtop-mart-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      # Self-hosted Mongo over the private compose network (never public).
      DATABASE_URL: 'mongodb://mongo:27017/maxtop-mart'
      # Secrets — set in Coolify → Environment Variables.
      JWT_ACCESS_SECRET: '${JWT_ACCESS_SECRET}'
      JWT_REFRESH_SECRET: '${JWT_REFRESH_SECRET}'
      JWT_ACCESS_EXPIRES_IN: '1d'
      JWT_REFRESH_EXPIRES_IN: '7d'
      BCRYPT_SALT_ROUNDS: '12'
      # Public URLs (used for CORS, email links, payment callbacks).
      # API_PUBLIC_URL defaults to an auto-resolving sslip.io host that needs
      # no DNS record. Once the api.maxtopmart.com A record exists, set
      # API_PUBLIC_URL=https://api.maxtopmart.com in Coolify and redeploy.
      FRONTEND_URL: 'https://maxtopmart.com'
      BACKEND_URL: '${API_PUBLIC_URL:-https://maxtopmart-api.169.58.147.232.sslip.io}'
      PAYMENT_BACKEND_URL: '${API_PUBLIC_URL:-https://maxtopmart-api.169.58.147.232.sslip.io}'
      PAYMENT_FRONTEND_URL: 'https://maxtopmart.com'
    expose:
      - '5000'
    volumes:
      - 'uploads:/app/uploads'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./maxtop-mart-client
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js build: browser REST base = this + /api, and the
        # Socket.IO URL is derived from it automatically. Defaults to the
        # no-DNS sslip.io host; override API_PUBLIC_URL in Coolify to switch.
        NEXT_PUBLIC_SERVER_URL: '${API_PUBLIC_URL:-https://maxtopmart-api.169.58.147.232.sslip.io}'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
    expose:
      - '3000'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo-data:
  uploads:
